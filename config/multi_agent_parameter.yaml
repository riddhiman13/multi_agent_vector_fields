multi_agent_vector_fields:
  frequency: 5              # planning frequency [Hz]
  detect_shell_rad: 0.05    # sensing range [m]
  agent_mass: 1.0           # agent mass [kg]
  agent_radius: 0.05        # agent size [m]
  velocity_max: 1.0         # max speed [m/s]
  approach_dist: 0.01       # stop threshold [m]
  k_a_ee: [4.0, 4.0, 4.0, 4.0]      # attraction  4.0, 4.0, 4.0
  k_c_ee: [2.0, 4.0, 2.0, 4.0]      # circumvention , 4.0, 4.0, 4.0
  k_r_ee: [2.0, 2.0, 4.0, 4.0]      # repulsion  , 4.0, 4.0, 4.0
  k_r_force: [0.0, 0.0, 0.0, 0.0]   # body repulsion  , 0.0, 0.0, 0.0
  k_d_ee: [3.0, 3.0, 3.0, 3.0]      # damping , 3.0, 3.0, 3.0
  k_manip: [0.0, 0.0, 0.0, 0.0]     # manipulability , 0.0, 0.0, 0.0
  cpu_affinity: [12, 14]    # CPU affinity